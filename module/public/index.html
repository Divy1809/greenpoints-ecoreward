<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GreenPoints | Add Eco Activity</title><style>body{font-family:Arial,sans-serif;max-width:720px;margin:40px auto;padding:0 20px;color:#12352b}h1{color:#1e7a50}form{display:grid;gap:12px;border:1px solid #b8d9c8;padding:22px;border-radius:10px}input,select,button{padding:10px;font-size:16px}button{background:#1e7a50;color:#fff;border:0;border-radius:6px;cursor:pointer}pre{background:#edf8f1;padding:14px;white-space:pre-wrap}</style></head><body>
<h1>GreenPoints</h1><p>Log an eco-friendly action and view the updated leaderboard.</p>
<form id="activityForm"><label>User ID <input name="userId" value="student-demo" required></label><label>Activity <select name="type"><option value="recycling">Recycling</option><option value="tree-planting">Tree planting</option><option value="public-transport">Public transport</option><option value="reusable-bag">Reusable bag</option></select></label><label>Points <input name="points" type="number" value="20" min="1" required></label><input name="timestamp" type="hidden"><button>Record activity</button></form>
<h2>Confirmation</h2><pre id="result">Waiting for activity input…</pre><h2>Leaderboard</h2><pre id="leaderboard">Loading…</pre>
<script>const result=document.querySelector('#result'),board=document.querySelector('#leaderboard');async function loadBoard(){board.textContent=JSON.stringify(await (await fetch('/leaderboard')).json(),null,2)}loadBoard();document.querySelector('#activityForm').addEventListener('submit',async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));v.points=Number(v.points);v.timestamp=new Date().toISOString();const r=await fetch('/activities',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(v)});result.textContent=JSON.stringify(await r.json(),null,2);loadBoard()})</script>
</body></html>
